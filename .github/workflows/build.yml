name: Build GlobalAdBlocker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: roothide
            artifact: GlobalAdBlocker-roothide
          - scheme: rootless
            artifact: GlobalAdBlocker-rootless

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install dpkg ldid xz || true

      - name: Install roothide Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Fix fakeroot on Apple Silicon
        run: |
          sed -i '' 's/$(FAKEROOT) -c/true/' $THEOS/makefiles/stage.mk
          sed -i '' 's/$(FAKEROOT) -r //' $THEOS/makefiles/package/deb.mk

      - name: Download iPhoneOS 26.5 SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          cd /tmp/ios-sdks
          git sparse-checkout set iPhoneOS26.5.sdk
          cp -r iPhoneOS26.5.sdk $THEOS/sdks/
          echo "Available SDKs:"
          ls -la $THEOS/sdks/

      - name: Install AltList framework
        run: |
          curl -L -o /tmp/altlist.deb "https://chariz.com/api/deb/com.opa334.altlist"
          cd /tmp
          ar -x altlist.deb
          tar -xzf data.tar.gz 2>/dev/null || tar -xf data.tar.* 2>/dev/null || true
          find . -name "AltList.framework" -type d 2>/dev/null
          if [ -d "./Library/Frameworks/AltList.framework" ]; then
            cp -r ./Library/Frameworks/AltList.framework $THEOS/lib/
          elif [ -d "./System/Library/Frameworks/AltList.framework" ]; then
            cp -r ./System/Library/Frameworks/AltList.framework $THEOS/lib/
          else
            echo "AltList.framework not found in deb, trying source build"
            git clone --depth 1 https://github.com/opa334/AltList.git /tmp/AltList-src
            cd /tmp/AltList-src
            sed -i '' 's/iphone:clang:14.5/iphone:clang:26.5/g' Makefile
            sed -i '' 's/iphone:clang:latest:7.0/iphone:clang:26.5:15.0/g' Makefile
            make ARCHS="arm64 arm64e"
            cp -r AltList.framework $THEOS/lib/
          fi
          echo "AltList installed:"
          ls -la $THEOS/lib/AltList.framework/

      - name: Build (${{ matrix.scheme }})
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}
          echo "Build output:"
          ls -la packages/

      - name: Rename deb
        run: |
          cd packages
          for f in *.deb; do
            mv "$f" "$(basename "$f" .deb)_${{ matrix.scheme }}.deb"
          done
          ls -la

      - name: Upload deb (${{ matrix.scheme }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/*.deb
          retention-days: 30
